name: ai_character_app
description: 星野式 AI 虚拟角色客户端；私聊 UI 使用 flutter_ai_ui_kit，对接自家后端 /v1
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_ai_ui_kit: ^0.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  go_router: ^14.6.2
  intl: ^0.20.3
  image_picker: ^1.2.3
  google_fonts: ^8.2.1
  audioplayers: ^6.5.0
  gal: ^2.3.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_svga: ^0.0.13
  zego_express_engine: ^3.25.0
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/login_bg.png
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
